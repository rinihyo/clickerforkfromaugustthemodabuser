<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicker Script Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #1a1a2e;
        color: #fff;
        padding: 2rem;
        gap: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        color: #888;
        text-align: center;
        max-width: 400px;
      }
      input {
        padding: 0.75rem 1rem;
        font-size: 1.25rem;
        border: none;
        border-radius: 0.5rem;
        width: 250px;
        text-align: center;
      }
      button {
        padding: 0.75rem 2rem;
        font-size: 1.25rem;
        cursor: pointer;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 0.5rem;
      }
      button:hover {
        background: #2563eb;
      }
      #status {
        color: #22c55e;
        font-size: 1rem;
      }
      code {
        background: #222;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Clicker Script Test</h1>
    <p>This page tests the embeddable clicker.js script. Click anywhere to enable audio, then set your name below.</p>
    <input type="text" id="name-input" placeholder="Enter your name" />
    <button id="set-name">Set Name</button>
    <code>import('https://clicker.jer.app/clicker.js')</code>
    <code>&lt;script src="https://clicker.jer.app/clicker.js"&gt;&lt;/script&gt;</code>

    <script>
      const nameInput = document.getElementById('name-input')
      const setNameBtn = document.getElementById('set-name')
      const status = document.getElementById('status')

      setNameBtn.addEventListener('click', () => {
        const name = nameInput.value.trim()
        if (name) {
          window._username = name
          status.textContent = 'Name set to: ' + name
        }
      })
    </script>
    <script src="/clicker.js"></script>
  </body>
</html>
