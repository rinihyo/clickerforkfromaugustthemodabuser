<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicker Admin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
        font-family: system-ui, sans-serif;
        background: #111;
        color: #fff;
      }
      h1 {
        margin-bottom: 1rem;
        font-size: 1.5rem;
      }
      #click {
        width: 120px;
        height: 120px;
        font-size: 1.25rem;
        cursor: pointer;
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 50%;
        transition: transform 0.1s;
        margin-bottom: 1rem;
        flex-shrink: 0;
      }
      #click:hover {
        background: #dc2626;
      }
      #click:active {
        transform: scale(0.95);
      }
      #result {
        margin-bottom: 1rem;
        font-size: 1rem;
        min-height: 1.5em;
      }
      .table-wrapper {
        width: 100%;
        max-width: 900px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 500px;
      }
      th,
      td {
        border: 1px solid #333;
        padding: 0.5rem;
        text-align: left;
        white-space: nowrap;
      }
      th {
        background: #222;
        font-size: 0.875rem;
      }
      td {
        font-size: 0.875rem;
      }
      tr {
        transition: background 0.2s;
      }
      tr.ack {
        background: #22c55e40;
      }
      .flag {
        font-size: 1.25rem;
        margin-right: 0.25rem;
      }
      #client-count {
        color: #888;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
      }
      .no-clients {
        color: #666;
        font-style: italic;
      }
      .click-btn {
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        cursor: pointer;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 0.25rem;
      }
      .click-btn:hover {
        background: #2563eb;
      }
      .click-btn:active {
        transform: scale(0.95);
      }
      .delete-btn {
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        cursor: pointer;
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 0.25rem;
        margin-left: 0.25rem;
      }
      .delete-btn:hover {
        background: #dc2626;
      }
      tr.disconnected {
        opacity: 0.5;
      }
      tr.disconnected td {
        color: #888;
      }
      #login-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      #login-modal.hidden {
        display: none;
      }
      #login-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      #login-form h2 {
        margin-bottom: 0.5rem;
      }
      #password-input {
        padding: 0.75rem 1rem;
        font-size: 1.25rem;
        border: none;
        border-radius: 0.5rem;
        width: 250px;
        text-align: center;
      }
      #login-btn {
        padding: 0.75rem 2rem;
        font-size: 1.25rem;
        cursor: pointer;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 0.5rem;
      }
      #login-btn:hover {
        background: #2563eb;
      }
      #login-error {
        color: #ef4444;
        min-height: 1.5em;
      }
      #main-content {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      #main-content.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="login-modal">
      <form id="login-form">
        <h2>Admin Login</h2>
        <input
          type="password"
          id="password-input"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button type="submit" id="login-btn">Login</button>
        <div id="login-error"></div>
      </form>
    </div>
    <div id="main-content">
      <h1>Clicker Admin</h1>
      <button id="click">CLICK!</button>
      <div id="result"></div>
      <div id="client-count">0 clients connected</div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Country</th>
              <th>Device</th>
              <th>Time</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="clients"></tbody>
        </table>
      </div>
    </div>
    <script>
      /**
       * @typedef {Object} ClientData
       * @property {string} id - Unique client identifier
       * @property {string} name - Display name
       * @property {string | null} country - Country code
       * @property {string | null} userAgent - User agent string
       * @property {number} connectedAt - Connection timestamp
       * @property {boolean} [connected] - Whether currently connected
       */

      /**
       * @typedef {Object} WsMessage
       * @property {string} type - Message type
       * @property {string} [id] - Client ID for ack/leave
       * @property {ClientData} [client] - Client data for join
       * @property {ClientData[]} [clients] - Client list
       */

      /** @type {HTMLDivElement} */
      const loginModal = /** @type {HTMLDivElement} */ (
        document.getElementById('login-modal')
      )
      /** @type {HTMLFormElement} */
      const loginForm = /** @type {HTMLFormElement} */ (
        document.getElementById('login-form')
      )
      /** @type {HTMLInputElement} */
      const passwordInput = /** @type {HTMLInputElement} */ (
        document.getElementById('password-input')
      )
      /** @type {HTMLElement} */
      const loginError = /** @type {HTMLElement} */ (
        document.getElementById('login-error')
      )
      /** @type {HTMLDivElement} */
      const mainContent = /** @type {HTMLDivElement} */ (
        document.getElementById('main-content')
      )
      /** @type {HTMLButtonElement} */
      const btn = /** @type {HTMLButtonElement} */ (
        document.getElementById('click')
      )
      /** @type {HTMLElement} */
      const result = /** @type {HTMLElement} */ (
        document.getElementById('result')
      )
      /** @type {HTMLTableSectionElement} */
      const clientsBody = /** @type {HTMLTableSectionElement} */ (
        document.getElementById('clients')
      )
      /** @type {HTMLElement} */
      const clientCount = /** @type {HTMLElement} */ (
        document.getElementById('client-count')
      )

      /** @type {WebSocket | null} */
      let ws = null
      /** @type {Record<string, ClientData>} */
      let clients = {}

      /**
       * Attempt to login with password
       * @param {string} password - The password to try
       * @returns {Promise<boolean>} Whether login succeeded
       */
      async function tryLogin(password) {
        try {
          const res = await fetch('/admin/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          })
          return res.ok
        } catch (_e) {
          return false
        }
      }

      /**
       * Check if already authenticated
       * @returns {Promise<boolean>} Whether already logged in
       */
      async function checkAuth() {
        try {
          const res = await fetch('/admin/auth')
          return res.ok
        } catch (_e) {
          return false
        }
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const password = passwordInput.value
        if (!password) return

        loginError.textContent = ''
        const success = await tryLogin(password)
        if (success) {
          loginModal.classList.add('hidden')
          mainContent.classList.add('visible')
          connectWs()
        } else {
          loginError.textContent = 'Invalid password'
          passwordInput.select()
        }
      })

      /**
       * Convert a 2-letter country code to a flag emoji
       * @param {string | null} countryCode - ISO 3166-1 alpha-2 country code
       * @returns {string} Flag emoji or globe
       */
      function countryToFlag(countryCode) {
        if (!countryCode || countryCode.length !== 2) return '🌍'
        const codePoints = countryCode
          .toUpperCase()
          .split('')
          .map((char) => 127397 + char.charCodeAt(0))
        return String.fromCodePoint(...codePoints)
      }

      /**
       * Parse user agent string to a friendly device description
       * @param {string | null} ua - User agent string
       * @returns {string} Device description with emoji
       */
      function parseUserAgent(ua) {
        if (!ua) return 'Unknown'
        if (ua.includes('iPhone')) return '📱 iPhone'
        if (ua.includes('iPad')) return '📱 iPad'
        if (ua.includes('Android')) return '📱 Android'
        if (ua.includes('Mac')) return '💻 Mac'
        if (ua.includes('Windows')) return '💻 Windows'
        if (ua.includes('Linux')) return '💻 Linux'
        return '🖥️ Unknown'
      }

      /**
       * Format a timestamp as a localized time string
       * @param {number} ts - Unix timestamp in milliseconds
       * @returns {string} Formatted time string
       */
      function formatTime(ts) {
        const d = new Date(ts)
        return d.toLocaleTimeString()
      }

      /**
       * Render the clients table from current state
       */
      function renderClients() {
        const list = Object.values(clients)
        const connectedCount = list.filter((c) => c.connected !== false).length
        clientCount.textContent =
          connectedCount +
          ' client' +
          (connectedCount !== 1 ? 's' : '') +
          ' connected'

        if (list.length === 0) {
          clientsBody.innerHTML =
            '<tr><td colspan="5" class="no-clients">No clients</td></tr>'
          return
        }

        const connected = list.filter((c) => c.connected !== false)
        const disconnected = list.filter((c) => c.connected === false)
        const sorted = [...connected, ...disconnected]

        clientsBody.innerHTML = sorted
          .map(
            (c) => `
          <tr id="client-${c.id}" class="${c.connected === false ? 'disconnected' : ''}">
            <td>${escapeHtml(c.name)}</td>
            <td><span class="flag">${countryToFlag(c.country)}</span>${c.country || '?'}</td>
            <td>${parseUserAgent(c.userAgent)}</td>
            <td>${formatTime(c.connectedAt)}</td>
            <td>
              ${c.connected !== false ? `<button class="click-btn" data-id="${c.id}">Click</button>` : ''}
              <button class="delete-btn" data-id="${c.id}">✕</button>
            </td>
          </tr>
        `
          )
          .join('')

        clientsBody.querySelectorAll('.click-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id')
            if (id && ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'trigger', targetId: id }))
            }
          })
        })

        clientsBody.querySelectorAll('.delete-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-id')
            if (id) {
              await fetch('/api/clients?id=' + encodeURIComponent(id), {
                method: 'DELETE',
              })
            }
          })
        })
      }

      /**
       * Escape HTML special characters to prevent XSS
       * @param {string} str - String to escape
       * @returns {string} Escaped HTML string
       */
      function escapeHtml(str) {
        const div = document.createElement('div')
        div.textContent = str
        return div.innerHTML
      }

      /**
       * Add a blink animation to a client row when ack received
       * @param {string} id - Client ID
       */
      function blinkClient(id) {
        const row = document.getElementById('client-' + id)
        if (row) {
          row.classList.add('ack')
          setTimeout(() => row.classList.remove('ack'), 300)
        }
      }

      /**
       * Connect to the admin WebSocket endpoint
       */
      function connectWs() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
        ws = new WebSocket(proto + '//' + location.host + '/ws/admin')

        ws.onmessage = (e) => {
          /** @type {WsMessage} */
          const msg = JSON.parse(e.data)
          if (msg.type === 'clients' && msg.clients) {
            clients = {}
            for (const c of msg.clients) {
              clients[c.id] = c
            }
            renderClients()
          } else if (msg.type === 'join' && msg.client) {
            clients[msg.client.id] = msg.client
            renderClients()
          } else if (msg.type === 'leave' && msg.id) {
            if (clients[msg.id]) {
              clients[msg.id].connected = false
            }
            renderClients()
          } else if (msg.type === 'deleted' && msg.id) {
            delete clients[msg.id]
            renderClients()
          } else if (msg.type === 'ack' && msg.id) {
            blinkClient(msg.id)
          }
        }

        ws.onclose = () => {
          result.textContent = 'Disconnected. Reconnecting...'
          setTimeout(connectWs, 1000)
        }

        ws.onerror = () => {
          if (ws) ws.close()
        }

        ws.onopen = () => {
          result.textContent = ''
        }
      }

      btn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'trigger' }))
          result.textContent = 'Triggered!'
          setTimeout(() => (result.textContent = ''), 1000)
        } else {
          result.textContent = 'Not connected'
        }
      })

      // Check if already authenticated on load
      checkAuth().then((ok) => {
        if (ok) {
          loginModal.classList.add('hidden')
          mainContent.classList.add('visible')
          connectWs()
        }
      })
    </script>
  </body>
</html>
