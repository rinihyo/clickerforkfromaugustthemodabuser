<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicker</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #111;
        color: #fff;
      }
      #status {
        font-size: 1.5rem;
        margin-bottom: 2rem;
      }
      #join-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      #join-form.hidden {
        display: none;
      }
      #name-input {
        padding: 0.75rem 1rem;
        font-size: 1.25rem;
        border: none;
        border-radius: 0.5rem;
        width: 250px;
        text-align: center;
      }
      #join-btn {
        padding: 0.75rem 2rem;
        font-size: 1.25rem;
        cursor: pointer;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 0.5rem;
      }
      #join-btn:hover {
        background: #2563eb;
      }
      #ready {
        color: #22c55e;
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #3b82f6;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s;
      }
      #flash.active {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="flash"></div>
    <div id="status">Enter your name to join</div>
    <form id="join-form">
      <input
        type="text"
        id="name-input"
        placeholder="Your name"
        autocomplete="off"
        required
      />
      <button type="submit" id="join-btn">Join</button>
    </form>
    <script>
      /**
       * @typedef {Object} WsMessage
       * @property {string} type - Message type ('click', 'ack')
       */

      /** @type {HTMLFormElement} */
      const joinForm = /** @type {HTMLFormElement} */ (
        document.getElementById('join-form')
      )
      /** @type {HTMLInputElement} */
      const nameInput = /** @type {HTMLInputElement} */ (
        document.getElementById('name-input')
      )
      /** @type {HTMLElement} */
      const status = /** @type {HTMLElement} */ (
        document.getElementById('status')
      )
      /** @type {HTMLElement} */
      const flash = /** @type {HTMLElement} */ (
        document.getElementById('flash')
      )

      /** @type {boolean} */
      let enabled = false
      /** @type {WebSocket | null} */
      let ws = null
      /** @type {string} */
      let clientId = getCookie('clientId') || generateId()
      /** @type {string} */
      let savedName = getCookie('userName') || ''
      /** @type {AudioContext | null} */
      let audioCtx = null
      /** @type {AudioBuffer | null} */
      let clickBuffer = null

      setCookie('clientId', clientId, 365)
      if (savedName) {
        nameInput.value = savedName
      }

      /**
       * Generate a random client ID
       * @returns {string} Random ID string
       */
      function generateId() {
        return 'c_' + Math.random().toString(36).slice(2, 11)
      }

      /**
       * Get a cookie value by name
       * @param {string} name - Cookie name
       * @returns {string | null} Cookie value or null
       */
      function getCookie(name) {
        const match = document.cookie.match(
          new RegExp('(^| )' + name + '=([^;]+)')
        )
        return match ? match[2] : null
      }

      /**
       * Set a cookie with expiration
       * @param {string} name - Cookie name
       * @param {string} value - Cookie value
       * @param {number} days - Days until expiration
       */
      function setCookie(name, value, days) {
        const expires = new Date(Date.now() + days * 864e5).toUTCString()
        document.cookie =
          name + '=' + value + '; expires=' + expires + '; path=/'
      }

      /**
       * Initialize Web Audio API context and load click sound
       * @returns {Promise<void>}
       */
      async function initAudio() {
        audioCtx = new AudioContext({
          latencyHint: 'interactive',
        })
        const response = await fetch('/click.mp3')
        const arrayBuffer = await response.arrayBuffer()
        clickBuffer = await audioCtx.decodeAudioData(arrayBuffer)
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume()
        }
      }

      /**
       * Play the click sound with minimal latency and send ack to server
       */
      function playClick() {
        if (!audioCtx || !clickBuffer) return
        const source = audioCtx.createBufferSource()
        source.buffer = clickBuffer
        source.connect(audioCtx.destination)
        source.start(0)
        flash.classList.add('active')
        setTimeout(() => flash.classList.remove('active'), 100)
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ack' }))
        }
      }

      joinForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const name = nameInput.value.trim()
        if (!name) return

        try {
          await initAudio()
          setCookie('userName', name, 365)
          enabled = true
          joinForm.classList.add('hidden')
          status.innerHTML = '<span id="ready">Ready :3</span>'
          connectWs(name)
        } catch (err) {
          status.textContent =
            'Error enabling audio: ' +
            (err instanceof Error ? err.message : String(err))
        }
      })

      /**
       * Connect to WebSocket server
       * @param {string} name - User's display name
       */
      function connectWs(name) {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
        const params = new URLSearchParams({ id: clientId, name })
        ws = new WebSocket(proto + '//' + location.host + '/ws?' + params)

        ws.onmessage = (e) => {
          /** @type {WsMessage} */
          const msg = JSON.parse(e.data)
          if (msg.type === 'click' && enabled) {
            playClick()
          }
        }

        ws.onclose = () => {
          status.textContent = 'Disconnected. Reconnecting...'
          setTimeout(() => connectWs(name), 1000)
        }

        ws.onerror = () => {
          if (ws) ws.close()
        }

        ws.onopen = () => {
          status.innerHTML = '<span id="ready">Ready :3</span>'
        }
      }
    </script>
  </body>
</html>
