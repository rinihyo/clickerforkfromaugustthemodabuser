name: Desktop Build

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos'
            os: 'macos-latest'
          - platform: 'windows'
            os: 'windows-latest'
          - platform: 'ubuntu'
            os: 'ubuntu-22.04'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Build Tauri App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          bun run tauri build

      - name: Get version
        shell: bash
        run: |
          VERSION=$(jq -r .version desktop/package.json | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Rename Artifacts
        shell: bash
        run: |
          mkdir artifacts

          # macOS
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" -print -quit)
            if [ -n "$DMG" ]; then
              cp "$DMG" artifacts/clicker.dmg
            fi
          fi

          # Windows
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            EXE=$(find desktop/src-tauri/target/release/bundle/nsis -name "*.exe" -print -quit)
            if [ -n "$EXE" ]; then
              cp "$EXE" artifacts/clicker.exe
            fi

            MSI=$(find desktop/src-tauri/target/release/bundle/msi -name "*.msi" -print -quit)
            if [ -n "$MSI" ]; then
              cp "$MSI" artifacts/clicker.msi
            fi
          fi

          # Linux
          if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
            APPIMAGE=$(find desktop/src-tauri/target/release/bundle/appimage -name "*.AppImage" -print -quit)
            if [ -n "$APPIMAGE" ]; then
              cp "$APPIMAGE" artifacts/clicker.AppImage
            fi

            DEB=$(find desktop/src-tauri/target/release/bundle/deb -name "*.deb" -print -quit)
            if [ -n "$DEB" ]; then
              cp "$DEB" artifacts/clicker.deb
            fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clicker-${{ matrix.platform }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: Collect release files
        run: |
          mkdir -p release
          find downloads -type f -name "clicker.*" -exec cp {} release/ \;

      - name: Publish nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly Desktop Build
          makeLatest: true
          draft: false
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: release/*
          token: ${{ secrets.GITHUB_TOKEN }}
